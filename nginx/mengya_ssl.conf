# ============================================================
# 萌芽平台 (Docker 版) - Nginx SSL (SNI 443) 反向代理配置
# 适用于宿主机 Nginx 反代至 Docker 暴露的 5174 端口
# 域名: mengya-docker.local (与传统版 mengya.local 零冲突共存)
# ============================================================

server {
    listen 80;
    server_name mengya-docker.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mengya-docker.local;

    # 独立 SSL 证书与私钥（与传统版证书隔离）
    ssl_certificate     /opt/service/nginx/ssl/mengya_docker.crt;
    ssl_certificate_key /opt/service/nginx/ssl/mengya_docker.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_DOCKER:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 文件上传限制
    client_max_body_size 20M;

    # 反向代理至 Docker 映射的一体化服务（统一托管前端静态页面、后端 API 与 Admin）
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
