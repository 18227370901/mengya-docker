# 萌芽平台 nginx SSL 反向代理配置
# 外部访问 443 端口（HTTPS），反代到后端与前端服务
# 自定义端口可通过环境变量 EXTERNAL_PORT 控制（默认 443）

server {
    listen 80;
    server_name localhost mengya.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost mengya.local;

    # SSL 证书（自签名或权威 CA 证书）
    ssl_certificate     /etc/nginx/ssl/mengya.crt;
    ssl_certificate_key /etc/nginx/ssl/mengya.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # 安全响应头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传文件大小限制
    client_max_body_size 20M;

    # 前端（Vite dev 或构建后的静态文件，支持 SPA 路由与 WebSocket HMR）
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
