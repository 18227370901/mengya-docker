# ============================================================
# 萌芽平台 - 独立 PostgreSQL 容器扩展编排 (Dedicated PG)
# 容器名称: ${DB_CONTAINER_NAME:-${APP_NAME:-mengya}-pg}
# 资源控制: 内核轻量化裁剪至 25~35MB，内部端口隔离不对宿主机暴露
# ============================================================

services:
  db:
    image: ${DB_IMAGE:-postgres:15-alpine}
    pull_policy: ${DB_PULL_POLICY:-if_not_present}
    container_name: ${DB_CONTAINER_NAME:-${APP_NAME:-mengya}-pg}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mengya}
      POSTGRES_USER: ${POSTGRES_USER:-mengya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mengya123}
    volumes:
      - pgdata:${DB_DATA_DIR:-/var/lib/postgresql}
    expose:
      - "5432"
    command: >
      postgres
      -c shared_buffers=24MB
      -c work_mem=1MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c max_worker_processes=2
      -c max_parallel_workers=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_maintenance_workers=1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mengya} -d ${POSTGRES_DB:-mengya}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
