# ============================================================
# 萌芽平台 - SQLite 本地化单文件存储扩展编排 (SQLite Local DB)
# 内存极简: 零额外数据库容器，整站常驻内存约 50~60MB
# 持久化: 挂载宿主机本地 ./data 目录至容器内部
# ============================================================

services:
  backend:
    restart: unless-stopped
    environment:
      DATABASE_URL: ""
    volumes:
      - ./data:/app/data
      - ./data/db.sqlite3:/app/db.sqlite3
