# ============================================================
# 萌芽平台 - SQLite 本地化单文件存储扩展编排 (SQLite Local DB)
# 内存收益: 零额外数据库容器，整站常驻内存约 50~60MB
# 持久化: 宿主机当前项目 ./data 目录挂载进容器内部
# ============================================================

services:
  backend:
    restart: unless-stopped
    environment:
      DATABASE_URL: ""
    volumes:
      - ./data:/app/data

  worker:
    restart: unless-stopped
    environment:
      DATABASE_URL: ""
    volumes:
      - ./data:/app/data
