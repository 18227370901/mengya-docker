# ============================================================
# 萌芽（mengya）平台 Docker Compose 核心编排（多数据库模式自适应架构）
#
# 架构模型：
#   - 多数据库部署模式：支持 SQLite单文件 / 共享PG实例 / 独立专属容器
#   - 基础服务：backend (Django+DRF+React一体化托管), redis/worker (可选)
#   - 数据库服务：由 COMPOSE_FILE 环境变量按需合成 (docker-compose.db.yml 或 docker-compose.sqlite.yml)
#   - 默认模式：未指定时通过 COMPOSE_FILE 默认加载独立 PG 容器 (docker-compose.db.yml)
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-mengya}_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mengya:mengya123@db:5432/mengya}
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: "*"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-${ADMIN_PHONE:-admin}}
      ADMIN_PHONE: ${ADMIN_PHONE:-${ADMIN_USERNAME:-admin}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-管理员}
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py
      - ./templates:/app/templates
      - ./static:/app/static
    # 宿主机直接暴露 FRONTEND_PORT（默认 5174），直达 Django 一体化服务（同时提供 API 与前端 SPA 静态页面）
    ports:
      - "${FRONTEND_PORT:-5174}:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_data --skip-if-exists &&
             python manage.py ensure_admin &&
             python manage.py invalidate_tokens &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --worker-class gthread --max-requests 1000 --max-requests-jitter 100 --timeout 60"

  redis:
    profiles: ["celery"]
    image: redis:7-alpine
    container_name: ${APP_NAME:-mengya}_redis
    restart: unless-stopped
    # 仅在内部容器网络暴露端口，不对宿主机暴露 6379
    expose:
      - "6379"
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["celery"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-mengya}_worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mengya:mengya123@db:5432/mengya}
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      - backend
    command: celery -A config worker -l info --pool=solo

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-mengya-docker}_net
