# ============================================================
# 萌芽（mengya）平台 Docker Compose 编排（极致低资源优化版）
#
# 服务说明：
#   db       数据库（默认 pgvector/pgvector:pg18，已轻量裁剪至 25~35MB）
#   backend  单体一体化服务（Django + DRF + React 前端静态托管，Gunicorn 50~60MB）
#   redis    缓存/消息队列（可选，profile: celery）
#   worker   Celery 异步任务（可选， profile: celery）
#
# 资源控制保障：
#   - 每一个容器内存上限 (mem_limit) 均严格限制在 100MB 以内，全面对齐轻量级云服务器环境
#   - Gunicorn 采用 1 Worker + 4 Threads (gthread)，彻底杜绝 CPU 空转轮询
# ============================================================

services:
  db:
    # 默认使用 pgvector 镜像（支持向量检索，方便后续 AI 功能扩展）
    image: ${DB_IMAGE:-pgvector/pgvector:pg18}
    pull_policy: ${DB_PULL_POLICY:-missing}
    container_name: mengya_db
    mem_limit: 80m
    environment:
      POSTGRES_DB: mengya
      POSTGRES_USER: mengya
      POSTGRES_PASSWORD: mengya123
    volumes:
      # PostgreSQL 18+ 镜像要求：数据卷必须挂载到父目录 /var/lib/postgresql（而非 /var/lib/postgresql/data）
      - pgdata:${DB_DATA_DIR:-/var/lib/postgresql}
    # 仅在内部容器网络暴露端口，不对宿主机暴露 5432，保障数据库安全
    expose:
      - "5432"
    # PostgreSQL 极致轻量化内核参数调优：常驻内存从 100MB+ 压减至 25MB~35MB
    command: >
      postgres
      -c shared_buffers=24MB
      -c work_mem=1MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c max_worker_processes=2
      -c max_parallel_workers=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_maintenance_workers=1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mengya -d mengya"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    profiles: ["celery"]
    image: redis:7-alpine
    container_name: mengya_redis
    mem_limit: 40m
    # 仅在内部容器网络暴露端口，不对宿主机暴露 6379
    expose:
      - "6379"
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mengya_backend
    mem_limit: 100m
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mengya:mengya123@db:5432/mengya
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: "*"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-${ADMIN_PHONE:-admin}}
      ADMIN_PHONE: ${ADMIN_PHONE:-${ADMIN_USERNAME:-admin}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-管理员}
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py
      - ./templates:/app/templates
      - ./static:/app/static
    # 宿主机直接暴露 FRONTEND_PORT（默认 5174），直达 Django 一体化服务（同时提供 API 与前端 SPA 静态页面）
    ports:
      - "${FRONTEND_PORT:-5174}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_data --skip-if-exists &&
             python manage.py ensure_admin &&
             python manage.py invalidate_tokens &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --worker-class gthread --max-requests 1000 --max-requests-jitter 100 --timeout 60"

  worker:
    profiles: ["celery"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mengya_worker
    mem_limit: 100m
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mengya:mengya123@db:5432/mengya
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      - backend
    command: celery -A config worker -l info --pool=solo

volumes:
  pgdata:
