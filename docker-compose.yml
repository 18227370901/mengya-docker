
# ============================================================
# 萌芽（mengya）平台 Docker Compose 编排
#
# 服务说明：
#   db       数据库（默认 pgvector/pgvector:pg18，可用 DB_IMAGE 覆盖）
#   backend  后端 API（Django + DRF）
#   frontend 前端页面（React + Vite dev）
#   redis    缓存/消息队列（可选，profile: celery）
#   worker   Celery 异步任务（可选， profile: celery）
#   nginx    SSL 反向代理（可选，profile: nginx）
#
# 可选服务默认不启动，由 run.sh 启动前自动检测/判断后按需附加：
#   - redis/worker：检测到后端存在 Celery 任务时启用；ENABLE_WORKER=1/0 可强制控制
#   - nginx：       需要时 ENABLE_NGINX=1 启用（统一 443 HTTPS 入口）
# 手动启动示例：
#   docker compose --profile celery up -d
#   docker compose --profile nginx up -d
# ============================================================

services:
  db:
    # 默认使用 pgvector 镜像（支持向量检索，方便后续 AI 功能扩展）
    image: ${DB_IMAGE:-pgvector/pgvector:pg18}
    container_name: mengya_db
    environment:
      POSTGRES_DB: mengya
      POSTGRES_USER: mengya
      POSTGRES_PASSWORD: mengya123
    volumes:
      # PostgreSQL 18+ 镜像要求：数据卷必须挂载到父目录 /var/lib/postgresql（而非 /var/lib/postgresql/data）
      - pgdata:/var/lib/postgresql
    # 仅在内部容器网络暴露端口，不对宿主机暴露 5432，保障数据库安全
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mengya -d mengya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["celery"]
    image: redis:7-alpine
    container_name: mengya_redis
    # 仅在内部容器网络暴露端口，不对宿主机暴露 6379
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mengya_backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mengya:mengya123@db:5432/mengya
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: "*"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-${ADMIN_PHONE:-admin}}
      ADMIN_PHONE: ${ADMIN_PHONE:-${ADMIN_USERNAME:-admin}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-管理员}
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py
    # 仅在内部容器网络暴露端口，前端通过 http://backend:8000 代理转发，不对宿主机公网暴露 8000
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             (python manage.py loaddata apps/core/fixtures/initial_data.json 2>/dev/null || python manage.py init_data --skip-if-exists) &&
             python manage.py ensure_admin &&
             python manage.py runserver 0.0.0.0:8000"

  worker:
    profiles: ["celery"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mengya_worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mengya:mengya123@db:5432/mengya
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py
    depends_on:
      - backend
    command: celery -A config worker -l info --pool=solo

  frontend:
    build: ./frontend
    container_name: mengya_frontend
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    container_name: mengya_nginx
    ports:
      - "${EXTERNAL_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/mengya_ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
